<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Toss App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h2 {
            margin-bottom: 20px;
        }

        .result {
            font-size: 40px;
            margin: 20px 0;
        }

        button {
            padding: 12px 20px;
            border: none;
            background: #f59e0b;
            color: white;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #d97706;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Coin Toss</h2>
    <div class="result" id="result">?</div>
    <button onclick="tossCoin()">Toss</button>
</div>

<script>
    function tossCoin() {
        let random = Math.random();

        let result = random < 0.5 ? "Head" : "Tail";

        document.getElementById("result").innerText = result;
    }
</script>

</body>
</html>
